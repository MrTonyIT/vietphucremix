<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="kbSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14100b" />
      <stop offset="35%" stopColor="#2c1d12" />
      <stop offset="70%" stopColor="#3d2716" />
      <stop offset="100%" stopColor="#190f0a" />
    </linearGradient>
    <radialGradient id="kbMoon" cx="50%" cy="26%" r="42%">
      <stop offset="0%" stopColor="#fef08a" stopOpacity="0.85" />
      <stop offset="30%" stopColor="#ca8a04" stopOpacity="0.3" />
      <stop offset="70%" stopColor="#b45309" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#14100b" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="villageRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#991b1b" />
      <stop offset="50%" stopColor="#78350f" />
      <stop offset="100%" stopColor="#451a03" />
    </linearGradient>
  </defs>

  <!-- Bầu trời hoàng hôn Kinh Bắc - Đất Quan Họ hữu tình -->
  <rect width="1920" height="1080" fill="url(#kbSky)" />
  <circle cx="960" cy="280" r="320" fill="url(#kbMoon)" />
  <circle cx="960" cy="260" r="58" fill="#fffbeb" fill-opacity="0.9" />

  <!-- Dãy núi non Tràng An - Yên Tử xa xăm trầm mặc -->
  <path d="M-50,490 Q220,380 520,440 Q840,360 1180,430 Q1520,370 1980,460 L1980,700 L-50,700 Z" fill="#1c130d" fill-opacity="0.8" />
  <path d="M-80,540 Q320,460 720,510 Q1120,440 1520,490 Q1780,450 2020,520 L2020,720 L-80,720 Z" fill="#291a11" fill-opacity="0.85" />

  <!-- Mái đình làng Kinh Bắc cong vút hình đầu đao -->
  <g transform="translate(640, 360)">
    <!-- Tầng mái trên với đầu đao cong vút -->
    <path d="M320,0 Q180,90 20,110 L620,110 Q460,90 320,0 Z" fill="url(#villageRoof)" stroke="#f59e0b" stroke-width="1.8" />
    <!-- Đầu đao rồng uốn lượn hai đầu mái -->
    <path d="M20,110 Q-30,90 -20,50 Q-5,80 30,105" stroke="#fef08a" stroke-width="2.5" fill="none" />
    <path d="M620,110 Q670,90 660,50 Q645,80 610,105" stroke="#fef08a" stroke-width="2.5" fill="none" />

    <rect x="120" y="110" width="400" height="40" fill="#1b100a" stroke="#ca8a04" stroke-width="1" />

    <!-- Tầng mái dưới rộng lớn che mát sân đình -->
    <path d="M320,140 Q100,240 -120,270 L760,270 Q540,240 320,140 Z" fill="url(#villageRoof)" stroke="#f59e0b" stroke-width="2.2" />
    <!-- Đầu đao tầng dưới cực đại -->
    <path d="M-120,270 Q-180,240 -160,180 Q-140,230 -100,260" stroke="#fef08a" stroke-width="3" fill="none" />
    <path d="M760,270 Q820,240 800,180 Q780,230 740,260" stroke="#fef08a" stroke-width="3" fill="none" />

    <!-- Hàng cột gỗ lim đình làng to khỏe -->
    <rect x="-40" y="270" width="720" height="90" fill="#140b07" stroke="#78350f" stroke-width="1.5" />
    <rect x="0" y="270" width="20" height="90" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
    <rect x="130" y="270" width="20" height="90" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
    <rect x="270" y="270" width="20" height="90" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
    <rect x="350" y="270" width="20" height="90" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
    <rect x="490" y="270" width="20" height="90" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
    <rect x="620" y="270" width="20" height="90" fill="#78350f" stroke="#ca8a04" stroke-width="1" />
  </g>

  <!-- Cây đa cổ thụ rợp bóng mát bên cánh trái -->
  <g transform="translate(60, 220)">
    <!-- Thân cây đa sần sùi với rễ phụ buông dài -->
    <path d="M120,540 Q160,320 80,220 Q240,160 320,180 Q260,340 220,540 Z" fill="#271810" stroke="#78350f" stroke-width="1.5" />
    <path d="M90,360 Q60,460 70,540" stroke="#1c110b" stroke-width="8" fill="none" />
    <path d="M260,340 Q290,450 280,540" stroke="#1c110b" stroke-width="9" fill="none" />
    <!-- Tán lá đa xanh biếc rậm rạp -->
    <ellipse cx="180" cy="160" rx="190" ry="100" fill="#142c1b" fill-opacity="0.85" />
    <ellipse cx="280" cy="180" rx="140" ry="80" fill="#064e3b" fill-opacity="0.75" />
    <ellipse cx="100" cy="190" rx="120" ry="70" fill="#047857" fill-opacity="0.65" />
  </g>

  <!-- Bến nước & dòng sông Cầu uốn lượn thắm đượm câu ca Quan họ -->
  <rect y="720" width="1920" height="360" fill="#100b08" />

  <!-- Dòng sông Cầu phản chiếu ánh trăng rằm và mái đình làng -->
  <ellipse cx="960" cy="820" rx="420" ry="16" fill="#ca8a04" fill-opacity="0.25" />
  <ellipse cx="960" cy="890" rx="340" ry="14" fill="#991b1b" fill-opacity="0.2" />
  <ellipse cx="960" cy="960" rx="480" ry="18" fill="#d97706" fill-opacity="0.18" />

  <!-- Nón quai thao & dải yếm lụa cách điệu thanh tao bên bờ nước -->
  <g transform="translate(1540, 780) scale(1.4)">
    <!-- Nón quai thao to tròn truyền thống -->
    <ellipse cx="60" cy="30" rx="70" ry="20" fill="#3d2716" stroke="#f59e0b" stroke-width="2" />
    <circle cx="60" cy="30" r="14" fill="#fef08a" fill-opacity="0.8" />
    <!-- Quai thao thắt lụa buông dài -->
    <path d="M20,40 Q-10,80 20,130" stroke="#f59e0b" stroke-width="2.5" fill="none" />
    <path d="M100,40 Q130,80 100,130" stroke="#f59e0b" stroke-width="2.5" fill="none" />
    <path d="M50,48 Q60,90 50,140" stroke="#ec4899" stroke-width="2.5" fill="none" />
  </g>
</svg>
