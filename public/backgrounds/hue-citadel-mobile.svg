<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="hueSkyM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#140b08" />
      <stop offset="25%" stopColor="#25120c" />
      <stop offset="55%" stopColor="#451a10" />
      <stop offset="80%" stopColor="#220e09" />
      <stop offset="100%" stopColor="#100705" />
    </linearGradient>
    <radialGradient id="sunM" cx="50%" cy="24%" r="40%">
      <stop offset="0%" stopColor="#ffeec2" stopOpacity="0.8" />
      <stop offset="30%" stopColor="#d4af37" stopOpacity="0.3" />
      <stop offset="70%" stopColor="#b84034" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#140b08" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="goldRoofM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#b45309" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>
  </defs>

  <!-- Nền trời hoàng cung trầm ấm -->
  <rect width="1080" height="1920" fill="url(#hueSkyM)" />
  <circle cx="540" cy="460" r="380" fill="url(#sunM)" />
  <circle cx="540" cy="420" r="64" fill="#fff5d6" fill-opacity="0.9" />

  <!-- Dải vân mây cung đình uốn lượn phong cách hoàng gia -->
  <path d="M-60,380 C180,320 340,430 540,360 C740,290 880,380 1140,330" stroke="#d4af37" stroke-width="2" stroke-opacity="0.3" fill="none" />
  <path d="M-40,420 C200,360 380,470 560,400 C760,330 920,420 1120,370" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Dãy núi Ngự Bình phía sau Điện Thái Hòa -->
  <path d="M-50,860 Q260,780 540,810 Q820,770 1130,840 L1130,1100 L-50,1100 Z" fill="#20110d" fill-opacity="0.8" />

  <!-- Cung Điện Thái Hòa góc phối cảnh chính diện sừng sững -->
  <g transform="translate(140, 720)">
    <!-- Tầng cổ diêm trên -->
    <path d="M400,0 Q260,70 120,90 L680,90 Q540,70 400,0 Z" fill="url(#goldRoofM)" stroke="#fef08a" stroke-width="1.5" />
    <rect x="200" y="90" width="400" height="45" fill="#180e0a" stroke="#d4af37" stroke-width="1" />
    <rect x="230" y="90" width="10" height="45" fill="#991b1b" />
    <rect x="310" y="90" width="10" height="45" fill="#991b1b" />
    <rect x="395" y="90" width="10" height="45" fill="#991b1b" />
    <rect x="480" y="90" width="10" height="45" fill="#991b1b" />
    <rect x="560" y="90" width="10" height="45" fill="#991b1b" />

    <!-- Tầng mái đại điện rộng lớn -->
    <path d="M400,130 Q160,220 -80,245 L880,245 Q640,220 400,130 Z" fill="url(#goldRoofM)" stroke="#fef08a" stroke-width="2.5" />
    <rect x="-30" y="245" width="860" height="90" fill="#1b100c" stroke="#d4af37" stroke-width="1.5" />

    <!-- Hàng cột gỗ lim sơn son thếp vàng to lớn uy nghi -->
    <rect x="0" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="110" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="230" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="345" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="435" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="550" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="670" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />
    <rect x="780" y="245" width="22" height="90" fill="#b91c1c" stroke="#f59e0b" stroke-width="1" />

    <!-- Bậc tam cấp thềm rồng đá Thanh -->
    <path d="M-80,335 L880,335 L960,520 L-160,520 Z" fill="#291a15" stroke="#78350f" stroke-width="2" />
    <!-- Đôi rồng đá chầu hai bên bậc thềm -->
    <path d="M120,520 L120,400 Q200,370 280,420 L280,520 Z" fill="#1a110d" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M520,520 L520,400 Q600,370 680,420 L680,520 Z" fill="#1a110d" stroke="#f59e0b" stroke-width="1.5" />
  </g>

  <!-- Đèn lồng cung đình son đỏ treo hai bên cột phía trước -->
  <g transform="translate(100, 560)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#d4af37" stroke-width="2" />
    <ellipse cx="0" cy="110" rx="36" ry="46" fill="#991b1b" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="0" cy="110" rx="20" ry="46" fill="#b91c1c" />
    <circle cx="0" cy="110" r="14" fill="#fbbf24" fill-opacity="0.9" />
    <line x1="0" y1="156" x2="0" y2="210" stroke="#d4af37" stroke-width="2" />
  </g>
  <g transform="translate(980, 560)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#d4af37" stroke-width="2" />
    <ellipse cx="0" cy="110" rx="36" ry="46" fill="#991b1b" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="0" cy="110" rx="20" ry="46" fill="#b91c1c" />
    <circle cx="0" cy="110" r="14" fill="#fbbf24" fill-opacity="0.9" />
    <line x1="0" y1="156" x2="0" y2="210" stroke="#d4af37" stroke-width="2" />
  </g>

  <!-- Hồ nước Thái Dịch phản chiếu sóng sánh ở chân màn hình -->
  <rect y="1320" width="1080" height="600" fill="#140c08" />
  <ellipse cx="540" cy="1480" rx="420" ry="24" fill="#f59e0b" fill-opacity="0.22" />
  <ellipse cx="540" cy="1620" rx="360" ry="18" fill="#d97706" fill-opacity="0.18" />
  <ellipse cx="540" cy="1780" rx="480" ry="26" fill="#b45309" fill-opacity="0.15" />

  <!-- Khóm sen vàng & sen hồng dập dờn trên mặt nước -->
  <g transform="translate(240, 1680) scale(1.6)">
    <ellipse cx="40" cy="30" rx="50" ry="14" fill="#102414" fill-opacity="0.85" stroke="#10b981" stroke-width="1" />
    <path d="M25,20 Q40,-10 55,20 Z" fill="#991b1b" fill-opacity="0.8" />
    <path d="M32,20 Q40,-2 48,20 Z" fill="#f43f5e" fill-opacity="0.9" />
    <circle cx="40" cy="10" r="4" fill="#fef08a" />
  </g>
  <g transform="translate(740, 1720) scale(1.6)">
    <ellipse cx="40" cy="30" rx="50" ry="14" fill="#102414" fill-opacity="0.85" stroke="#10b981" stroke-width="1" />
    <path d="M25,20 Q40,-10 55,20 Z" fill="#991b1b" fill-opacity="0.8" />
    <path d="M32,20 Q40,-2 48,20 Z" fill="#f43f5e" fill-opacity="0.9" />
    <circle cx="40" cy="10" r="4" fill="#fef08a" />
  </g>
</svg>
