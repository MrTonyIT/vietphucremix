<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="hoianSkyM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0b0814" />
      <stop offset="25%" stopColor="#1a1228" />
      <stop offset="55%" stopColor="#301825" />
      <stop offset="85%" stopColor="#1c0f17" />
      <stop offset="100%" stopColor="#0a050b" />
    </linearGradient>
    <radialGradient id="moonM" cx="50%" cy="18%" r="42%">
      <stop offset="0%" stopColor="#fff8e7" stopOpacity="0.95" />
      <stop offset="25%" stopColor="#fde047" stopOpacity="0.35" />
      <stop offset="65%" stopColor="#f97316" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#0b0814" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Nền trời đêm phố Hội An ngõ nhỏ trăng rằm -->
  <rect width="1080" height="1920" fill="url(#hoianSkyM)" />
  <circle cx="540" cy="340" r="360" fill="url(#moonM)" />
  <circle cx="540" cy="340" r="62" fill="#fffdfa" fill-opacity="0.9" />

  <!-- Dãy nhà cổ phố Hội vươn cao hai bên ngõ nhỏ -->
  <!-- Tường nhà cổ bên trái với mái ngói âm dương rêu phong -->
  <g transform="translate(-60, 480)">
    <polygon points="0,220 220,120 440,220" fill="#2d1c15" stroke="#b45309" stroke-width="2" />
    <rect x="20" y="220" width="400" height="780" fill="#1f110c" />
    <rect x="50" y="240" width="340" height="740" fill="#d97706" fill-opacity="0.22" />
    <!-- Cửa chớp gỗ kiểu Pháp - Hội An -->
    <rect x="180" y="320" width="140" height="180" fill="#120805" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="180" y="580" width="140" height="260" fill="#120805" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Giàn hoa giấy rực sắc hồng thắm leo kín ban công tầng 2 -->
    <ellipse cx="260" cy="220" rx="180" ry="40" fill="#db2777" fill-opacity="0.65" />
    <ellipse cx="320" cy="260" rx="110" ry="32" fill="#f43f5e" fill-opacity="0.75" />
  </g>

  <!-- Tường nhà cổ bên phải -->
  <g transform="translate(680, 460)">
    <polygon points="0,240 220,120 440,240" fill="#2d1c15" stroke="#b45309" stroke-width="2" />
    <rect x="20" y="240" width="420" height="800" fill="#1f110c" />
    <rect x="50" y="260" width="360" height="760" fill="#d97706" fill-opacity="0.22" />
    <rect x="100" y="340" width="140" height="180" fill="#120805" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="100" y="600" width="140" height="260" fill="#120805" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="140" cy="230" rx="160" ry="38" fill="#e11d48" fill-opacity="0.65" />
    <ellipse cx="80" cy="280" rx="110" ry="30" fill="#ec4899" fill-opacity="0.7" />
  </g>

  <!-- Dây đèn lồng giăng chéo qua ngõ phố cổ -->
  <path d="M120,440 Q540,580 960,450" stroke="#78350f" stroke-width="2" fill="none" />
  <path d="M140,680 Q540,820 940,690" stroke="#78350f" stroke-width="2" fill="none" />

  <!-- Dãy lồng đèn ngũ sắc lung linh treo giữa ngõ -->
  <!-- Dây trên -->
  <g transform="translate(320, 510)">
    <ellipse cx="0" cy="40" rx="30" ry="38" fill="#b91c1c" fill-opacity="0.9" stroke="#fca5a5" stroke-width="1.5" />
    <circle cx="0" cy="40" r="14" fill="#fbbf24" />
    <line x1="0" y1="78" x2="0" y2="130" stroke="#f59e0b" stroke-width="2" />
  </g>
  <g transform="translate(540, 560)">
    <ellipse cx="0" cy="40" rx="36" ry="34" fill="#d97706" fill-opacity="0.95" stroke="#fde047" stroke-width="1.5" />
    <circle cx="0" cy="40" r="16" fill="#fffbeb" />
    <line x1="0" y1="74" x2="0" y2="126" stroke="#f59e0b" stroke-width="2" />
  </g>
  <g transform="translate(760, 520)">
    <ellipse cx="0" cy="40" rx="28" ry="36" fill="#059669" fill-opacity="0.9" stroke="#6ee7b7" stroke-width="1.5" />
    <circle cx="0" cy="40" r="12" fill="#a7f3d0" />
    <line x1="0" y1="76" x2="0" y2="128" stroke="#34d399" stroke-width="2" />
  </g>

  <!-- Dây dưới -->
  <g transform="translate(240, 710)">
    <ellipse cx="0" cy="40" rx="28" ry="36" fill="#be185d" fill-opacity="0.9" stroke="#fbcfe8" stroke-width="1.5" />
    <circle cx="0" cy="40" r="13" fill="#fff1f2" />
    <line x1="0" y1="76" x2="0" y2="128" stroke="#f472b6" stroke-width="2" />
  </g>
  <g transform="translate(440, 770)">
    <ellipse cx="0" cy="40" rx="34" ry="32" fill="#7c3aed" fill-opacity="0.9" stroke="#ddd6fe" stroke-width="1.5" />
    <circle cx="0" cy="40" r="15" fill="#f5f3ff" />
    <line x1="0" y1="72" x2="0" y2="124" stroke="#c084fc" stroke-width="2" />
  </g>
  <g transform="translate(640, 770)">
    <ellipse cx="0" cy="40" rx="34" ry="32" fill="#dc2626" fill-opacity="0.95" stroke="#fecaca" stroke-width="1.5" />
    <circle cx="0" cy="40" r="15" fill="#fef2f2" />
    <line x1="0" y1="72" x2="0" y2="124" stroke="#f87171" stroke-width="2" />
  </g>
  <g transform="translate(840, 720)">
    <ellipse cx="0" cy="40" rx="28" ry="36" fill="#0284c7" fill-opacity="0.9" stroke="#bae6fd" stroke-width="1.5" />
    <circle cx="0" cy="40" r="13" fill="#e0f2fe" />
    <line x1="0" y1="76" x2="0" y2="128" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Dòng sông Hoài ở cuối ngõ với mặt nước lung linh -->
  <rect y="1360" width="1080" height="560" fill="#0c070f" />
  <ellipse cx="540" cy="1520" rx="420" ry="24" fill="#d97706" fill-opacity="0.32" />
  <ellipse cx="540" cy="1660" rx="460" ry="26" fill="#b91c1c" fill-opacity="0.28" />
  <ellipse cx="540" cy="1800" rx="500" ry="30" fill="#7c3aed" fill-opacity="0.22" />

  <!-- Những chiếc hoa đăng rực rỡ trôi trên mặt nước sông Hoài -->
  <g transform="translate(320, 1540) scale(1.6)">
    <polygon points="20,0 35,25 5,25" fill="#f43f5e" fill-opacity="0.85" />
    <polygon points="20,5 30,25 10,25" fill="#fb7185" fill-opacity="0.95" />
    <polygon points="5,25 35,25 28,34 12,34" fill="#e11d48" />
    <circle cx="20" cy="18" r="4" fill="#fef08a" />
    <ellipse cx="20" cy="36" rx="28" ry="7" fill="#f43f5e" fill-opacity="0.5" />
  </g>
  <g transform="translate(700, 1620) scale(1.8)">
    <polygon points="20,0 35,25 5,25" fill="#f59e0b" fill-opacity="0.9" />
    <polygon points="20,5 30,25 10,25" fill="#fde047" fill-opacity="1" />
    <polygon points="5,25 35,25 28,34 12,34" fill="#d97706" />
    <circle cx="20" cy="18" r="4" fill="#fffbeb" />
    <ellipse cx="20" cy="36" rx="32" ry="8" fill="#f59e0b" fill-opacity="0.5" />
  </g>
  <g transform="translate(480, 1740) scale(1.5)">
    <polygon points="20,0 35,25 5,25" fill="#a855f7" fill-opacity="0.85" />
    <polygon points="20,5 30,25 10,25" fill="#c084fc" fill-opacity="0.95" />
    <polygon points="5,25 35,25 28,34 12,34" fill="#7e22ce" />
    <circle cx="20" cy="18" r="4" fill="#fef08a" />
    <ellipse cx="20" cy="36" rx="26" ry="6" fill="#a855f7" fill-opacity="0.45" />
  </g>
</svg>
